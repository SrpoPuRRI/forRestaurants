<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF9B3D"/><stop offset="1" stop-color="#E96E22"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#171717" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1440" height="1120" fill="#F4F3F0"/>
  <rect width="1440" height="12" fill="#111111"/>
  <text x="76" y="84" fill="#E87527" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">IDENTIDAD · RONDA 01</text>
  <text x="76" y="145" fill="#111111" font-family="Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5">Black&amp;White POS</text>
  <text x="78" y="181" fill="#686868" font-family="Arial,sans-serif" font-size="18">Una plataforma para restaurantes distintos. Una identidad fácil de reconocer.</text>
  <rect x="1190" y="68" width="174" height="42" rx="21" fill="#111111"/>
  <circle cx="1214" cy="89" r="6" fill="#F28C28"/><text x="1231" y="95" fill="#F8F8F6" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">CONCEPTO A</text>

  <text x="76" y="240" fill="#777777" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">TRES RUTAS DE MARCA</text>
  <g filter="url(#shadow)">
    <rect x="76" y="265" width="400" height="360" rx="24" fill="#FFFFFF"/>
    <rect x="520" y="265" width="400" height="360" rx="24" fill="#111111"/>
    <rect x="964" y="265" width="400" height="360" rx="24" fill="#FFFFFF"/>
  </g>
  <!-- B&W Counter -->
  <rect x="112" y="300" width="76" height="76" rx="21" fill="#111111"/>
  <path d="M150 311v53" stroke="#F7F7F5" stroke-width="3" opacity=".85"/>
  <text x="123" y="350" fill="#F7F7F5" font-family="Arial,sans-serif" font-size="22" font-weight="800">B</text>
  <text x="156" y="350" fill="#F7F7F5" font-family="Arial,sans-serif" font-size="22" font-weight="800">W</text>
  <path d="M123 365h54" stroke="url(#orange)" stroke-width="4" stroke-linecap="round"/>
  <text x="112" y="449" fill="#111111" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="-1">Black&amp;White</text>
  <text x="114" y="479" fill="#777777" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">POS</text>
  <text x="112" y="542" fill="#111111" font-family="Arial,sans-serif" font-size="17" font-weight="700">01 · B&amp;W Counter</text>
  <text x="112" y="572" fill="#777777" font-family="Arial,sans-serif" font-size="14">Monograma limpio; fuerte en pantalla pequeña.</text>

  <!-- Ampersand connector -->
  <circle cx="594" cy="338" r="43" fill="#242424" stroke="#4A4A4A"/>
  <text x="567" y="356" fill="#F7F7F5" font-family="Georgia,serif" font-size="62" font-weight="700">&amp;</text>
  <circle cx="631" cy="364" r="6" fill="#F28C28"/>
  <text x="650" y="349" fill="#F7F7F5" font-family="Arial,sans-serif" font-size="26" font-weight="800">Black&amp;White</text>
  <text x="652" y="378" fill="#F28C28" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="4">POINT OF SALE</text>
  <text x="556" y="449" fill="#F7F7F5" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="-1">Black&amp;White</text>
  <text x="559" y="479" fill="#BEBEBE" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">POS</text>
  <text x="556" y="542" fill="#F7F7F5" font-family="Arial,sans-serif" font-size="17" font-weight="700">02 · The Connector</text>
  <text x="556" y="572" fill="#BEBEBE" font-family="Arial,sans-serif" font-size="14">La &amp; representa negocios que convergen.</text>

  <!-- Modular receipt -->
  <rect x="1000" y="302" width="65" height="76" rx="12" fill="#111111"/>
  <path d="M1018 322h30M1018 336h28M1018 350h18" stroke="#F7F7F5" stroke-width="4" stroke-linecap="round"/>
  <rect x="1041" y="350" width="10" height="10" rx="2" fill="#F28C28"/>
  <text x="1082" y="349" fill="#111111" font-family="Arial,sans-serif" font-size="25" font-weight="800">Black&amp;White</text>
  <text x="1084" y="378" fill="#E87527" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="4">POS</text>
  <text x="1000" y="449" fill="#111111" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="-1">Black&amp;White</text>
  <text x="1002" y="479" fill="#777777" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">POS</text>
  <text x="1000" y="542" fill="#111111" font-family="Arial,sans-serif" font-size="17" font-weight="700">03 · Modular Ticket</text>
  <text x="1000" y="572" fill="#777777" font-family="Arial,sans-serif" font-size="14">Una comanda abstracta, versátil y clara.</text>

  <text x="76" y="700" fill="#777777" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">PALETA RECOMENDADA · CONTRASTE CÁLIDO</text>
  <g filter="url(#shadow)"><rect x="76" y="726" width="1288" height="292" rx="24" fill="#FFFFFF"/></g>
  <g font-family="Arial,sans-serif">
    <rect x="108" y="758" width="215" height="132" rx="16" fill="#111111"/><text x="128" y="860" fill="#FFFFFF" font-size="16" font-weight="700">TINTA · #111111</text>
    <rect x="341" y="758" width="215" height="132" rx="16" fill="#F7F7F5" stroke="#E4E3DF"/><text x="361" y="860" fill="#111111" font-size="16" font-weight="700">BLANCO · #F7F7F5</text>
    <rect x="574" y="758" width="215" height="132" rx="16" fill="#5D5D5D"/><text x="594" y="860" fill="#FFFFFF" font-size="16" font-weight="700">GRAFITO · #5D5D5D</text>
    <rect x="807" y="758" width="215" height="132" rx="16" fill="#E6E5E1"/><text x="827" y="860" fill="#111111" font-size="16" font-weight="700">NIEBLA · #E6E5E1</text>
    <rect x="1040" y="758" width="292" height="132" rx="16" fill="#F28C28"/><text x="1060" y="860" fill="#111111" font-size="16" font-weight="700">ACCIÓN · #F28C28</text>
  </g>
  <text x="108" y="943" fill="#111111" font-family="Arial,sans-serif" font-size="20" font-weight="700">La marca vive en blanco y negro. El naranja guía la acción.</text>
  <text x="108" y="976" fill="#777777" font-family="Arial,sans-serif" font-size="15">El restaurante puede cambiar su ambiente visual sin perder el sello reconocible de la plataforma.</text>
  <text x="76" y="1072" fill="#777777" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.2">BLACK&amp;WHITE POS  /  IDENTIDAD EN EXPLORACIÓN</text>
  <text x="1364" y="1072" text-anchor="end" fill="#777777" font-family="Arial,sans-serif" font-size="12">01</text>
</svg>
