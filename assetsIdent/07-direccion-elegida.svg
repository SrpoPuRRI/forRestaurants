    <rect x="104" y="720" width="220" height="88" rx="13" fill="#1B1B1B"/><text x="122" y="783" fill="#FBF8F2">Carbón · #1B1B1B</text>
    <rect x="340" y="720" width="220" height="88" rx="13" fill="#FBF8F2" stroke="#DED7CC"/><text x="358" y="783" fill="#1B1B1B">Marfil · #FBF8F2</text>
    <rect x="576" y="720" width="220" height="88" rx="13" fill="#8B6E54"/><text x="594" y="783" fill="#FFFFFF">Madera · #8B6E54</text>
    <rect x="812" y="720" width="220" height="88" rx="13" fill="#D9D3C8"/><text x="830" y="783" fill="#1B1B1B">Piedra · #D9D3C8</text>
    <rect x="1048" y="720" width="286" height="88" rx="13" fill="#D77936"/><text x="1066" y="783" fill="#1B1B1B">Terracota · #D77936</text>
  </g>
  <text x="104" y="838" fill="#756D64" font-family="Arial,sans-serif" font-size="13">El marfil y la madera dan calidez; terracota destaca acciones y estados activos.</text>

  <!-- application strip -->
  <text x="76" y="922" fill="#8B6E54" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">APLICACIÓN DEL SISTEMA</text>
  <rect x="76" y="947" width="1288" height="108" rx="20" fill="#E9E2D7"/>
  <rect x="100" y="965" width="420" height="72" rx="13" fill="#1B1B1B"/>
  <rect x="118" y="978" width="36" height="36" rx="11" fill="#FBF8F2"/><text x="136" y="1005" text-anchor="middle" fill="#1B1B1B" font-family="Georgia,serif" font-size="27" font-weight="700">&amp;</text><circle cx="148" cy="1010" r="3.5" fill="#D77936"/>
  <text x="169" y="994" fill="#FBF8F2" font-family="Arial,sans-serif" font-size="13" font-weight="700">Luchitos · Sanguchería</text><text x="169" y="1017" fill="#C7B8A9" font-family="Arial,sans-serif" font-size="10">MÓDULOS ACTIVOS · PEDIDOS · CAJA · COCINA</text>
  <rect x="170" y="1026" width="145" height="6" rx="3" fill="#D77936"/>
  <text x="570" y="989" fill="#1B1B1B" font-family="Arial,sans-serif" font-size="16" font-weight="700">La marca es la plataforma.</text>
  <text x="570" y="1018" fill="#756D64" font-family="Arial,sans-serif" font-size="14">Cada local aporta su nombre, menú y módulos configurados desde Setter.</text>
  <text x="1364" y="1084" text-anchor="end" fill="#8B6E54" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">DIRECCIÓN VISUAL · V1</text>
