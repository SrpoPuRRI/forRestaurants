  <text x="279" y="372" fill="#1B1B1B" font-family="Arial,sans-serif" font-size="55" font-weight="800" letter-spacing="-2">Black&amp;White</text>
  <path d="M284 391h46" stroke="#D77936" stroke-width="4" stroke-linecap="round"/>
  <text x="344" y="403" fill="#8B6E54" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="5">POS</text>
  <text x="122" y="492" fill="#1B1B1B" font-family="Arial,sans-serif" font-size="19" font-weight="700">La ampersand une negocios, equipos y flujos distintos.</text>
  <text x="122" y="524" fill="#756D64" font-family="Arial,sans-serif" font-size="15">El punto terracota funciona como el momento donde las operaciones se conectan.</text>
  <text x="122" y="568" fill="#8B6E54" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.3">RECOMENDACIÓN: USAR LA &amp; COMO SELLO; EL NOMBRE COMPLETO COMO FIRMA.</text>

  <text x="982" y="264" fill="#C7B8A9" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">VERSIÓN OSCURA</text>
  <rect x="992" y="304" width="112" height="112" rx="31" fill="#FBF8F2"/>
  <circle cx="1048" cy="360" r="37" fill="none" stroke="#1B1B1B" stroke-opacity=".18" stroke-width="1.5"/>
  <text x="1048" y="378" text-anchor="middle" fill="#1B1B1B" font-family="Georgia,serif" font-size="59" font-weight="700">&amp;</text>
  <circle cx="1078" cy="388" r="6" fill="#D77936"/>
  <text x="1124" y="352" fill="#FBF8F2" font-family="Arial,sans-serif" font-size="25" font-weight="800">Black&amp;White</text>
  <text x="1126" y="382" fill="#D77936" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="4">POS</text>
  <path d="M990 452h330" stroke="#47423D"/>
  <text x="992" y="491" fill="#FBF8F2" font-family="Arial,sans-serif" font-size="18" font-weight="700">Una identidad cálida,</text>
  <text x="992" y="520" fill="#FBF8F2" font-family="Arial,sans-serif" font-size="18" font-weight="700">sin perder el contraste.</text>
  <text x="992" y="562" fill="#B9ADA1" font-family="Arial,sans-serif" font-size="14">La &amp; se mantiene legible en tamaños pequeños.</text>

  <!-- Palette -->
  <text x="76" y="670" fill="#8B6E54" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">PALETA · HOSPITALIDAD CÁLIDA</text>
  <g filter="url(#shadow)"><rect x="76" y="696" width="1288" height="170" rx="22" fill="#FBF8F2"/></g>
