    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E38B50"/><stop offset="1" stop-color="#C96935"/></linearGradient>
  </defs>
  <rect width="1440" height="1120" fill="#F4F1EB"/><rect width="1440" height="12" fill="#1B1B1B"/>
  <text x="76" y="78" fill="#A66E49" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="4">BLACK&amp;WHITE POS · DIRECCIÓN ELEGIDA</text>
  <text x="76" y="141" fill="#1B1B1B" font-family="Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-1.8">El Conector</text>
  <text x="78" y="177" fill="#756D64" font-family="Arial,sans-serif" font-size="18">Una marca central para restaurantes con operaciones distintas.</text>
  <rect x="1115" y="67" width="249" height="43" rx="22" fill="#1B1B1B"/><circle cx="1140" cy="88" r="6" fill="#D77936"/><text x="1157" y="94" fill="#FBF8F2" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">CONECTOR + CÁLIDO</text>

  <!-- Main identity panel -->
  <g filter="url(#shadow)"><rect x="76" y="220" width="842" height="388" rx="26" fill="#FBF8F2"/><rect x="946" y="220" width="418" height="388" rx="26" fill="#1B1B1B"/></g>
  <text x="112" y="264" fill="#8B6E54" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">LOGOTIPO PRINCIPAL · SOBRE FONDO CLARO</text>
  <rect x="122" y="313" width="124" height="124" rx="34" fill="#1B1B1B"/>
  <circle cx="184" cy="375" r="40" fill="none" stroke="#FBF8F2" stroke-opacity=".28" stroke-width="1.5"/>
  <text x="184" y="396" text-anchor="middle" fill="#FBF8F2" font-family="Georgia,serif" font-size="65" font-weight="700">&amp;</text>
